<html>
    <head>
        <title>Register</title>
    </head>
    <body>
        <h1>Register</h1>
        <hr>
        <form action="#" method="post">
            <label for="firstname">firstname</label>
            <input type="text" name="firstname" id="firstname" placeholder="firstname" minlength="3" maxlength="20">
            <br>
            <label for="lastname">lastname</label>
            <input type="text" name="lastname" id="lastname" placeholder="lastname" minlength="3" maxlength="20">
            <br>
            <label for="email">email</label>
            <input type="email" name="email" id="email" placeholder="email" minlength="3" maxlength="20">
            <br>
            <label for="password">password</label>
            <input type="password" name="password" id="password" placeholder="password" minlength="3" maxlength="20">
            <br>
            <input type="checkbox" name="showpassword" id="showpassword" onclick="showpass()">
            <label for="showpassword">show password</label>
            <br>
            <label for="phone">phone</label>
            <input type="tel" name="phone" id="phone" placeholder="phone">
            <br>
            <label for="age">age</label>
            <input type="number" name="age" id="age" placeholder="age" min="10" max="25">
            <br>
            <label for="date">date</label>
            <input type="date" name="date" id="date" placeholder="date">
            <br>
            <label for="image">image</label>
            <input type="file" name="image" id="image" placeholder="image">
            <br>
            <label for="lang">arabic</label>
            <input type="radio" name="lang" id="ar">
            <label for="lang">english</label>
            <input type="radio" name="lang" id="en">
            <br>
            <label for="message">message</label>
            <br>
            <textarea id="message" rows="10" cols="10"></textarea>
            <br>

            <button type="submit">Submit</button>
            <button type="reset">reset</button>    
        </form>
    </body>
    <script>
        function showpass(){
           const password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }
        }
    </script>
</html>
